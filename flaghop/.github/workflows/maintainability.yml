name: Maintainability checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Place the checkout and dedicated tooling on capped storage
        shell: bash
        run: |
          set -euo pipefail
          capped="$RUNNER_TEMP/flaghop-capped"
          mkdir -p "$capped"
          sudo mount -t tmpfs -o "size=1999998976,uid=$(id -u),gid=$(id -g),mode=700" tmpfs "$capped"
          shopt -s dotglob nullglob
          for entry in "$GITHUB_WORKSPACE"/*; do mv -- "$entry" "$capped/"; done
          sudo mount --bind "$capped" "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/.tmp" "$GITHUB_WORKSPACE/.cache" "$GITHUB_WORKSPACE/.artifacts/disposable"
          mountpoint -q "$GITHUB_WORKSPACE"
          echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: scripts/frontend.sh install
      - name: Install desktop runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libnss3 libasound2t64 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxi6 libxtst6 libfontconfig1
      - name: Install Python dependencies
        run: python -m venv .venv && .venv/bin/python -m pip install --no-cache-dir -r requirements-dev.txt
      - name: Check frontend contracts, components and production bundle
        run: scripts/frontend.sh check
      - name: Tests, formatting and lint
        run: scripts/check-maintainability.sh
      - name: Bundled scanner Python compatibility
        working-directory: vendor/ctf_profiler
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
        run: ../../.venv/bin/python -m unittest discover -s tests -p test_dependency_compat.py
      - name: Fixture desktop smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: .venv/bin/python tests/desktop/workspace_smoke.py
      - name: Hardware map desktop states and project isolation
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: .venv/bin/python tests/desktop/hardware_smoke.py
      - name: Independent document windows and reader grouping
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: .venv/bin/python tests/desktop/documents_smoke.py
      - name: Synthetic Deep scan job, import and evidence reopening
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: .venv/bin/python tests/desktop/scanner_smoke.py
