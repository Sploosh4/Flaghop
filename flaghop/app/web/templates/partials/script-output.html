<div id="script-output-modal" class="legion-modal-overlay" aria-hidden="true">
    <div class="legion-modal output-modal" role="dialog" aria-modal="true" aria-labelledby="script-output-modal-title">
        <div class="panel-header modal-header">
            <h2 id="script-output-modal-title">Script Output</h2>
            <p id="script-output-meta">No script selected</p>
            <button id="script-output-modal-close" class="modal-close-btn" type="button" aria-label="Close dialog">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <div class="modal-actions modal-toolbar-actions">
            <button id="script-output-copy-button" class="icon-btn" type="button" title="Copy to Clipboard" aria-label="Copy to Clipboard">
                <i class="fa-regular fa-copy" aria-hidden="true"></i>
            </button>
            <button id="script-output-download-button" class="icon-btn" type="button" title="Download .txt" aria-label="Download .txt">
                <i class="fa-solid fa-download" aria-hidden="true"></i>
            </button>
        </div>
        <div class="process-command-block">
            <div class="process-command-header">
                <span>Command</span>
                <button id="script-output-command-copy" type="button" title="Copy command" aria-label="Copy command">
                    <i class="fa-regular fa-copy" aria-hidden="true"></i>
                </button>
            </div>
            <div id="script-output-command" class="process-command-text"></div>
        </div>
        <div class="process-command-block process-output-block">
            <div class="process-command-header">
                <span>Output</span>
            </div>
            <div id="script-output-text" class="ansi-output-view" role="textbox" aria-readonly="true"></div>
        </div>
    </div>
</div>
