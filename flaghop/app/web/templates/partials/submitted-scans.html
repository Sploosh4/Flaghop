<section class="panel activity-history-panel">
    <div class="activity-history" aria-labelledby="submitted-scans-modal-title">
        <div class="panel-header modal-header">
            <h2 id="submitted-scans-modal-title">Scans</h2>
            <p><span id="scan-history-count">{{ snapshot.scan_history | length }}</span> total</p>

        </div>
        <div class="table-wrap modal-table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Kind</th>
                    <th>Status</th>
                    <th>Targets</th>
                    <th>Scope</th>
                    <th>Mode</th>
                    <th>Created</th>
                    <th>Result</th>
                </tr>
                </thead>
                <tbody id="scan-history-body"></tbody>
            </table>
        </div>
    </div>
</section>
