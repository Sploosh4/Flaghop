<div id="credentials-modal" class="legion-modal-overlay" aria-hidden="true">
    <div class="legion-modal modal-table-modal" role="dialog" aria-modal="true" aria-labelledby="credentials-modal-title">
        <div class="panel-header modal-header">
            <h2 id="credentials-modal-title">Captured Credentials</h2>
            <p id="credentials-modal-meta">0 captures</p>
            <button id="credentials-modal-close" class="modal-close-btn" type="button" aria-label="Close dialog">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <div class="modal-actions">
            <button id="credentials-copy-hashes-button" type="button">Copy Dedupe Hashes</button>
            <button id="credentials-download-hashes-button" type="button">Download Dedupe Hashes</button>
            <button id="credentials-download-json-button" type="button">Download JSON</button>
        </div>
        <div class="table-wrap modal-table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Captured</th>
                    <th>Tool</th>
                    <th>Source</th>
                    <th>Username</th>
                    <th>Hash</th>
                    <th>Details</th>
                </tr>
                </thead>
                <tbody id="credential-captures-body"></tbody>
            </table>
        </div>
    </div>
</div>
