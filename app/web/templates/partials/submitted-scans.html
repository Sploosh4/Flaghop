<div id="submitted-scans-modal" class="legion-modal-overlay" aria-hidden="true">
    <div class="legion-modal modal-table-modal" role="dialog" aria-modal="true" aria-labelledby="submitted-scans-modal-title">
        <div class="panel-header modal-header">
            <h2 id="submitted-scans-modal-title">Submitted Scans</h2>
            <p><span id="scan-history-count">{{ snapshot.scan_history | length }}</span> total</p>
            <button id="submitted-scans-modal-close" class="modal-close-btn" type="button" aria-label="Close dialog">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <div class="table-wrap modal-table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Kind</th>
                    <th>Status</th>
                    <th>Targets</th>
                    <th>Scope</th>
                    <th>Mode</th>
                    <th>Created</th>
                    <th>Result</th>
                </tr>
                </thead>
                <tbody id="scan-history-body"></tbody>
            </table>
        </div>
    </div>
</div>
