<div id="credential-capture-config-modal" class="legion-modal-overlay" aria-hidden="true">
    <div class="legion-modal settings-modal" role="dialog" aria-modal="true" aria-labelledby="credential-capture-config-modal-title">
        <div class="panel-header modal-header">
            <h2 id="credential-capture-config-modal-title">Credential Capture Configuration</h2>
            <p id="credential-capture-config-status">Idle</p>
            <button id="credential-capture-config-modal-close" class="modal-close-btn" type="button" aria-label="Close dialog">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <p class="meta-note">Common high-value Responder and ntlmrelayx options live here. Use Advanced Arguments for the rest.</p>
        <form id="credential-capture-config-form" class="scheduler-form">
            <fieldset class="danger-group scheduler-settings-group">
                <legend>Responder</legend>
                <label>
                    Interface
                    <select id="credential-config-responder-interface"></select>
                </label>
                <label>
                    Mode
                    <select id="credential-config-responder-mode">
                        <option value="active">active</option>
                        <option value="passive">passive</option>
                    </select>
                </label>
                <label class="checkbox">
                    <input id="credential-config-responder-wpad" type="checkbox">
                    Enable WPAD serving
                </label>
                <label class="checkbox">
                    <input id="credential-config-responder-force-wpad-auth" type="checkbox">
                    Force WPAD authentication
                </label>
                <label class="checkbox">
                    <input id="credential-config-responder-proxy-auth" type="checkbox">
                    Enable proxy authentication prompts
                </label>
                <label class="checkbox">
                    <input id="credential-config-responder-dhcp" type="checkbox">
                    Enable DHCP poisoning
                </label>
                <label class="checkbox">
                    <input id="credential-config-responder-dhcp-dns" type="checkbox">
                    Enable DHCP DNS poisoning
                </label>
                <label class="checkbox">
                    <input id="credential-config-responder-basic-auth" type="checkbox">
                    Enable basic auth prompts
                </label>
                <label>
                    Advanced Arguments
                    <input id="credential-config-responder-extra-args" type="text" placeholder="-r -v">
                </label>
            </fieldset>
            <fieldset class="danger-group scheduler-settings-group">
                <legend>ntlmrelayx</legend>
                <label>
                    Relay Target
                    <input id="credential-config-ntlmrelayx-target" type="text" placeholder="smb://192.168.3.50">
                </label>
                <label>
                    Relay Targets File
                    <input id="credential-config-ntlmrelayx-targets-file" type="text" placeholder="/path/to/targets.txt">
                </label>
                <label>
                    Listener IP
                    <input id="credential-config-ntlmrelayx-interface-ip" type="text" placeholder="192.168.3.10">
                </label>
                <label class="checkbox">
                    <input id="credential-config-ntlmrelayx-smb2support" type="checkbox">
                    Enable SMB2 support
                </label>
                <label class="checkbox">
                    <input id="credential-config-ntlmrelayx-interactive" type="checkbox">
                    Enable interactive mode
                </label>
                <label class="checkbox">
                    <input id="credential-config-ntlmrelayx-socks" type="checkbox">
                    Enable SOCKS relay
                </label>
                <label class="checkbox">
                    <input id="credential-config-ntlmrelayx-output-hashes" type="checkbox">
                    Write captured hashes to a file
                </label>
                <label>
                    Advanced Arguments
                    <input id="credential-config-ntlmrelayx-extra-args" type="text" placeholder="--no-http-server">
                </label>
            </fieldset>
            <div class="modal-actions">
                <button id="credential-capture-config-save-button" type="submit">Save Credential Capture Configuration</button>
            </div>
        </form>
    </div>
</div>
