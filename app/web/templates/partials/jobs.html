<div id="jobs-modal" class="legion-modal-overlay" aria-hidden="true">
    <div class="legion-modal modal-table-modal" role="dialog" aria-modal="true" aria-labelledby="jobs-modal-title">
        <div class="panel-header modal-header">
            <h2 id="jobs-modal-title">Jobs</h2>
            <p><span id="job-count">{{ snapshot.jobs | length }}</span> total</p>
            <button id="jobs-modal-close" class="modal-close-btn" type="button" aria-label="Close dialog">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <div class="table-wrap modal-table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Started</th>
                    <th>Finished</th>
                    <th>Error</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="jobs-body"></tbody>
            </table>
        </div>
    </div>
</div>
