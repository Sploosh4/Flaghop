<section class="panel activity-history-panel">
    <div class="activity-history" aria-labelledby="scheduler-decisions-modal-title">
        <div class="panel-header modal-header">
            <h2 id="scheduler-decisions-modal-title">Decisions</h2>
            <p><span id="decision-count">{{ snapshot.scheduler_decisions | length }}</span> total</p>

        </div>
        <div class="table-wrap modal-table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Time</th>
                    <th>Target</th>
                    <th>Tool</th>
                    <th>Mode</th>
                    <th>Approved</th>
                    <th>Executed</th>
                    <th>Reason</th>
                    <th>Family</th>
                </tr>
                </thead>
                <tbody id="decisions-body"></tbody>
            </table>
        </div>
    </div>
</section>
