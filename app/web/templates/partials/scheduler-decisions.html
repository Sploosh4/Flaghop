<div id="scheduler-decisions-modal" class="legion-modal-overlay" aria-hidden="true">
    <div class="legion-modal modal-table-modal" role="dialog" aria-modal="true" aria-labelledby="scheduler-decisions-modal-title">
        <div class="panel-header modal-header">
            <h2 id="scheduler-decisions-modal-title">Scheduler Decisions</h2>
            <p><span id="decision-count">{{ snapshot.scheduler_decisions | length }}</span> total</p>
            <button id="scheduler-decisions-modal-close" class="modal-close-btn" type="button" aria-label="Close dialog">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <div class="table-wrap modal-table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Time</th>
                    <th>Target</th>
                    <th>Tool</th>
                    <th>Mode</th>
                    <th>Approved</th>
                    <th>Executed</th>
                    <th>Reason</th>
                    <th>Family</th>
                </tr>
                </thead>
                <tbody id="decisions-body"></tbody>
            </table>
        </div>
    </div>
</div>
